name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Schema contract (L2)
        run: pytest tests/test_schemas.py -v

      - name: Policy adversarial set — release gate must be 0
        run: pytest tests/test_policy.py -v

      - name: Full suite
        run: pytest -q

      - name: End-to-end demo (Fake provider, offline)
        run: python examples/demo.py --no-color

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 守卫脚本用 AST 只扫真实字符串常量，不会误伤文档里的示例 URL。
      # 它自己也有测试（tests/test_guards.py），保证"会真的报警"。
      - name: 边界守卫（危险字段 / 默认端点 / 图像与密钥）
        run: python scripts/check_guards.py